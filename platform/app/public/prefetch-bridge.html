<!doctype html>
<!--
  @author Sanjay Balai
  Background DICOM prefetch bridge.

  Purpose: let the LMS (biedx-react, a DIFFERENT origin) prefetch a case's DICOM
  into the *viewer's* Cache Storage WITHOUT opening a visible tab. Cache Storage
  is origin-partitioned, so the fetching MUST happen on the OHIF origin — this
  tiny page is loaded by the LMS inside a HIDDEN IFRAME (OHIF origin) and driven
  over postMessage. It reuses the same service worker + cache the viewer reads,
  so a prefetched case opens instantly later.

  Deliberately a plain static page (NOT the full OHIF bundle) so the hidden
  iframe stays light. It mirrors prefetchManager.ts in vanilla JS.

  ── Message protocol (channel: 'ohif-prefetch-bridge') ─────────────────────────
  LMS  -> bridge:
    { channel, type:'STATUS',   requestId, studyUIDs:[uid,…] }
    { channel, type:'PREFETCH', requestId, studies:[{ studyUID, priorUIDs?:[…] }] }
    { channel, type:'CLEAR' }
  bridge -> LMS:
    { channel, type:'READY',         controlling:boolean }
    { channel, type:'STATUS_RESULT', requestId, statusMap:{ uid:boolean } }
    { channel, type:'PROGRESS',      requestId, studyUID, done, total }
    { channel, type:'DONE',          requestId, studyUID, ok, error? }
  Security: the parent (LMS) origin is passed as ?parentOrigin=… ; only messages
  from that origin are honoured and replies go ONLY to it.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Prefetch bridge</title>
    <meta name="robots" content="noindex" />
  </head>
  <body>
    <script>
      (function () {
        var CHANNEL = 'ohif-prefetch-bridge';
        var FRAME_ACCEPT = 'multipart/related; type="application/octet-stream"; transfer-syntax=*';
        var JSON_ACCEPT = 'application/dicom+json';
        // Shared with prefetchManager.ts + the viewer (per-study "prefetched" flag).
        var FLAG_PREFIX = 'biedx-prefetched:';
        var CACHE_NAME = 'biedx-dicom-prefetch';
        var CONCURRENCY = 6;
        // ── Prefetch cache caps ────────────────────────────────────────────────
        // Whichever limit is hit first evicts the OLDEST whole study (never half a
        // study). All three are enforced SCAN-FREE from the localStorage notes
        // below — never cache.keys() (which throws "Operation too large" on a big
        // cache). Frame count alone is a poor proxy for disk (MG = few HUGE frames,
        // MR = many small frames), so the byte cap guards storage the frame cap
        // can't, and the study cap guarantees "max 10 from a selection".
        var MAX_STUDIES = 10; // keep at most this many prefetched studies
        var MAX_FRAMES = 50000; // keep at most this many cached frames in total
        var MAX_BYTES = 10 * 1024 * 1024 * 1024; // keep total storage under 10 GB

        var params = new URLSearchParams(location.search);
        // Only accept/reply to the LMS origin that embedded us.
        var PARENT_ORIGIN = params.get('parentOrigin') || '';
        // DICOMweb root; overridable so the LMS can pass the viewer's exact root.
        var WADO_ROOT = (params.get('wadoRoot') || '/pacs/dicom-web').replace(/\/$/, '');

        function postToParent(msg) {
          msg.channel = CHANNEL;
          if (window.parent && PARENT_ORIGIN) {
            window.parent.postMessage(msg, PARENT_ORIGIN);
          }
        }

        // ---- store-time flags (per study, value = ms epoch it was cached) -----
        function flagTs(uid) {
          try {
            var v = localStorage.getItem(FLAG_PREFIX + uid);
            return v ? parseInt(v, 10) || 0 : 0;
          } catch (e) {
            return 0;
          }
        }
        function markPrefetched(uid) {
          // (re)stamp store-time = now → marks this study most-recently used.
          try {
            localStorage.setItem(FLAG_PREFIX + uid, String(Date.now()));
          } catch (e) {
            /* ignore quota on the flag */
          }
        }
        function setFlagIfAbsent(uid) {
          // First time we SEE a study in the cache that we didn't prefetch (it was
          // cached by opening the case in the viewer) → record its store-time.
          try {
            if (!localStorage.getItem(FLAG_PREFIX + uid)) {
              localStorage.setItem(FLAG_PREFIX + uid, String(Date.now()));
            }
          } catch (e) {}
        }
        function removeFlag(uid) {
          try {
            localStorage.removeItem(FLAG_PREFIX + uid);
          } catch (e) {}
        }

        // ---- per-study PROBE url (scan-free "is it cached?") -------------------
        // cache.keys() throws "Operation too large" once the cache holds tens of
        // thousands of frames, which made listCachedStudyUids() return EMPTY → the
        // "prefetched" dot flipped OFF (and flags got wiped) even though the frames
        // were there. So detection must NEVER enumerate the whole cache. Instead we
        // remember ONE frame URL per prefetched study ("probe") and confirm the
        // study with an exact cache.match(probe) — O(1), works at any cache size.
        var PROBE_PREFIX = 'biedx-prefetch-probe:';
        function setProbe(uid, url) {
          try {
            if (url) {
              localStorage.setItem(PROBE_PREFIX + uid, url);
            }
          } catch (e) {}
        }
        function getProbe(uid) {
          try {
            return localStorage.getItem(PROBE_PREFIX + uid) || '';
          } catch (e) {
            return '';
          }
        }
        function removeProbe(uid) {
          try {
            localStorage.removeItem(PROBE_PREFIX + uid);
          } catch (e) {}
        }

        // ---- per-study FRAME COUNT (scan-free total-frames accounting) ---------
        // Remember how many frames each prefetched study has, so the frame cap can
        // sum the whole cache's frame count from localStorage — never a cache scan.
        var FRAMES_PREFIX = 'biedx-prefetch-frames:';
        function setFrameCount(uid, n) {
          try {
            localStorage.setItem(FRAMES_PREFIX + uid, String(n | 0));
          } catch (e) {}
        }
        function getFrameCount(uid) {
          try {
            var v = localStorage.getItem(FRAMES_PREFIX + uid);
            return v ? parseInt(v, 10) || 0 : 0;
          } catch (e) {
            return 0;
          }
        }
        function removeFrameCount(uid) {
          try {
            localStorage.removeItem(FRAMES_PREFIX + uid);
          } catch (e) {}
        }
        // Count how many of `urls` belong to study `uid`.
        function countUrlsForStudy(urls, uid) {
          var n = 0;
          for (var i = 0; i < urls.length; i++) {
            if (studyUidFromUrl(urls[i]) === uid) {
              n++;
            }
          }
          return n;
        }
        // Pick one frame URL belonging to `uid` (to use as that study's probe).
        function firstUrlForStudy(urls, uid) {
          for (var i = 0; i < urls.length; i++) {
            if (studyUidFromUrl(urls[i]) === uid) {
              return urls[i];
            }
          }
          return urls[0] || '';
        }
        // Is this study still cached? Exact match on its probe — no cache.keys().
        // If the probe is gone (evicted), drop the flag+probe so the dot turns OFF.
        async function isStudyCached(uid) {
          var probe = getProbe(uid);
          if (!probe) {
            // No probe (prefetched before this version) → fall back to the flag.
            return flagTs(uid) > 0;
          }
          try {
            var cache = await caches.open(CACHE_NAME);
            var hit = await cache.match(probe);
            if (!hit) {
              removeFlag(uid);
              removeProbe(uid);
            }
            return !!hit;
          } catch (e) {
            // Unexpected match failure → don't demote a known-prefetched study.
            return flagTs(uid) > 0;
          }
        }

        // ---- cache introspection + LRU cap ------------------------------------
        // The StudyInstanceUID is embedded in every WADO-RS frame URL as
        // /studies/{uid}/… so the cache itself is the source of truth for which
        // studies are cached — whether via prefetch OR by opening a case in the
        // viewer (both flow through the same service worker + cache).
        function studyUidFromUrl(url) {
          var m = /\/studies\/([^/?#]+)/.exec(url || '');
          return m ? m[1] : null;
        }
        // DEPRECATED / UNUSED: listCachedStudyUids + reconcileAndEnforceCap below
        // enumerate the WHOLE cache with cache.keys(), which throws "Operation too
        // large" once the cache holds tens of thousands of frames — that was the
        // bug that made the "prefetched" dot flip OFF. Detection now uses the
        // scan-free probe approach (isStudyCached) instead. Kept only for reference;
        // do NOT call these on any live path.
        async function listCachedStudyUids() {
          var set = new Set();
          try {
            var cache = await caches.open(CACHE_NAME);
            var reqs = await cache.keys();
            for (var i = 0; i < reqs.length; i++) {
              var uid = studyUidFromUrl(reqs[i].url);
              if (uid) {
                set.add(uid);
              }
            }
          } catch (e) {}
          return set;
        }
        async function deleteStudyFromCache(uid) {
          // Scan-free whole-study delete: re-list ONLY this study's frame URLs
          // (cheap QIDO) and delete each exact key — never cache.keys() (which
          // throws "Operation too large" on a big cache). Frames are stored under
          // their plain (query-stripped) URL, which is exactly what
          // enumerateFrameUrls returns, so each delete matches. If the re-list
          // fails (offline), the frames are left to age out / be caught by the SW
          // backstop, but we still drop the flag + probe + count below so the dot
          // turns OFF and the cap accounting stays correct.
          try {
            var cache = await caches.open(CACHE_NAME);
            var urls = await enumerateFrameUrls(uid);
            for (var i = 0; i < urls.length; i++) {
              await cache.delete(urls[i]);
            }
            var probe = getProbe(uid);
            if (probe) {
              await cache.delete(probe);
            }
          } catch (e) {}
          removeFlag(uid);
          removeProbe(uid);
          removeFrameCount(uid);
        }
        // Reconcile the store-time flags with the REAL cache, then enforce the
        // MAX_STUDIES cap by evicting the oldest-stored studies. Returns the Set
        // of studies that remain cached AFTER any eviction. Runs on every STATUS
        // and after each prefetch, so the cache never exceeds the cap no matter
        // how a study got in (prefetch or viewer-open).
        async function reconcileAndEnforceCap() {
          var present = await listCachedStudyUids();
          // Register any study cached outside prefetch (opened via View) so it
          // gets a store-time and shows as "prefetched" in the curriculum.
          present.forEach(function (uid) {
            setFlagIfAbsent(uid);
          });
          // Drop stale flags for studies the browser itself evicted from cache.
          try {
            for (var i = localStorage.length - 1; i >= 0; i--) {
              var key = localStorage.key(i);
              if (key && key.indexOf(FLAG_PREFIX) === 0) {
                var fUid = key.slice(FLAG_PREFIX.length);
                if (!present.has(fUid)) {
                  localStorage.removeItem(key);
                }
              }
            }
          } catch (e) {}
          // Evict oldest-stored studies until we are within the cap.
          if (present.size > MAX_STUDIES) {
            var arr = [];
            present.forEach(function (uid) {
              arr.push({ uid: uid, ts: flagTs(uid) });
            });
            arr.sort(function (a, b) {
              return a.ts - b.ts; // oldest first
            });
            var toEvict = present.size - MAX_STUDIES;
            for (var k = 0; k < toEvict; k++) {
              await deleteStudyFromCache(arr[k].uid);
              present.delete(arr[k].uid);
            }
          }
          return present;
        }

        // ---- cap enforcement (scan-free) --------------------------------------
        // Every prefetched study, OLDEST-cached first, with its frame count — read
        // entirely from the localStorage notes (no cache scan). `ts` is the cache
        // time (markPrefetched restamps on re-prefetch, so the newest study always
        // sorts last and is never the eviction victim).
        function listPrefetchedStudies() {
          var out = [];
          try {
            for (var i = 0; i < localStorage.length; i++) {
              var key = localStorage.key(i);
              if (key && key.indexOf(FLAG_PREFIX) === 0) {
                var uid = key.slice(FLAG_PREFIX.length);
                out.push({ uid: uid, ts: flagTs(uid), frames: getFrameCount(uid) });
              }
            }
          } catch (e) {}
          out.sort(function (a, b) {
            return a.ts - b.ts; // oldest first
          });
          return out;
        }
        // Enforce the three caps by evicting the OLDEST whole study until all hold.
        // Order: study-count → total-frames → storage-bytes. The frame/byte caps
        // never evict the LAST remaining study, so a single huge study the user
        // just asked for is always kept. Runs after each case is prefetched.
        async function enforceCaps() {
          var studies = listPrefetchedStudies();
          // 1) study-count cap — "max 10 from a selection".
          while (studies.length > MAX_STUDIES) {
            var v1 = studies.shift();
            await deleteStudyFromCache(v1.uid);
          }
          // 2) total-frame cap.
          var totalFrames = 0;
          for (var i = 0; i < studies.length; i++) {
            totalFrames += studies[i].frames;
          }
          while (totalFrames > MAX_FRAMES && studies.length > 1) {
            var v2 = studies.shift();
            totalFrames -= v2.frames;
            await deleteStudyFromCache(v2.uid);
          }
          // 3) storage-byte cap. usage is origin-wide, but the prefetch cache is
          // by far the largest consumer on the viewer origin, so this reliably
          // keeps total storage under MAX_BYTES (the guard the frame cap can't give
          // for few-but-huge MG frames).
          try {
            if (navigator.storage && navigator.storage.estimate) {
              var est = await navigator.storage.estimate();
              var usage = (est && est.usage) || 0;
              while (usage > MAX_BYTES && studies.length > 1) {
                var v3 = studies.shift();
                await deleteStudyFromCache(v3.uid);
                est = await navigator.storage.estimate();
                usage = (est && est.usage) || 0;
              }
            }
          } catch (e) {}
        }

        // ---- QIDO/WADO helpers -------------------------------------------------
        function dicomJsonValue(obj, tag) {
          var v = obj && obj[tag] && obj[tag].Value && obj[tag].Value[0];
          return v === undefined || v === null ? undefined : String(v);
        }

        // Every per-frame WADO-RS URL for a study (series -> instances -> frames).
        async function enumerateFrameUrls(studyUid) {
          var urls = [];
          var seriesRes = await fetch(WADO_ROOT + '/studies/' + studyUid + '/series', {
            headers: { Accept: JSON_ACCEPT },
            credentials: 'same-origin',
          });
          if (!seriesRes.ok) {
            throw new Error('series query failed (' + seriesRes.status + ')');
          }
          var seriesList = await seriesRes.json();
          for (var i = 0; i < (seriesList || []).length; i++) {
            var seriesUid = dicomJsonValue(seriesList[i], '0020000E');
            if (!seriesUid) {
              continue;
            }
            var instRes = await fetch(
              WADO_ROOT + '/studies/' + studyUid + '/series/' + seriesUid + '/instances',
              { headers: { Accept: JSON_ACCEPT }, credentials: 'same-origin' }
            );
            if (!instRes.ok) {
              continue;
            }
            var instances = await instRes.json();
            for (var j = 0; j < (instances || []).length; j++) {
              var sopUid = dicomJsonValue(instances[j], '00080018');
              if (!sopUid) {
                continue;
              }
              var numFrames = parseInt(dicomJsonValue(instances[j], '00280008') || '1', 10) || 1;
              var base =
                WADO_ROOT + '/studies/' + studyUid + '/series/' + seriesUid + '/instances/' + sopUid + '/frames/';
              for (var f = 1; f <= numFrames; f++) {
                urls.push(base + f);
              }
            }
          }
          return urls;
        }

        // Fetch one frame (through the SW -> cached), retrying transient failures.
        async function fetchFrameWithRetry(url, attempts) {
          attempts = attempts || 3;
          for (var i = 0; i < attempts; i++) {
            try {
              var res = await fetch(url, { headers: { Accept: FRAME_ACCEPT }, credentials: 'same-origin' });
              if (res.ok) {
                await res.arrayBuffer(); // drain so the SW's cache.put completes
                return true;
              }
            } catch (e) {
              /* network blip — retry */
            }
            if (i < attempts - 1) {
              await new Promise(function (r) {
                setTimeout(r, 300 * (i + 1));
              });
            }
          }
          return false;
        }

        async function runWithConcurrency(items, limit, worker) {
          var cursor = 0;
          var runners = [];
          var n = Math.min(limit, items.length);
          for (var k = 0; k < n; k++) {
            runners.push(
              (async function () {
                while (cursor < items.length) {
                  var idx = cursor++;
                  await worker(items[idx]);
                }
              })()
            );
          }
          await Promise.all(runners);
        }

        // ---- service worker ----------------------------------------------------
        async function ensureController() {
          if (!('serviceWorker' in navigator)) {
            return false;
          }
          try {
            await navigator.serviceWorker.ready;
            if (navigator.serviceWorker.controller) {
              return true;
            }
            await new Promise(function (resolve) {
              var timer = setTimeout(resolve, 3000);
              navigator.serviceWorker.addEventListener(
                'controllerchange',
                function () {
                  clearTimeout(timer);
                  resolve();
                },
                { once: true }
              );
            });
            return !!navigator.serviceWorker.controller;
          } catch (e) {
            return false;
          }
        }

        // ---- prefetch one CASE (primary study + priors) ------------------------
        // Split into "enumerate" (cheap QIDO — list every frame URL) and "download"
        // (the heavy part), so a whole batch can be enumerated FIRST. The LMS then
        // knows the total frame count up-front and shows a smooth, honest ETA instead
        // of guessing the sizes of the studies that haven't started yet.
        async function enumerateCase(studyUID, priorUIDs) {
          var uids = [studyUID].concat(priorUIDs || []).filter(Boolean);
          var allUrls = [];
          try {
            for (var i = 0; i < uids.length; i++) {
              var urls = await enumerateFrameUrls(uids[i]);
              allUrls = allUrls.concat(urls);
            }
          } catch (e) {
            return { studyUID: studyUID, uids: uids, urls: null, error: (e && e.message) || 'enumerate failed' };
          }
          return { studyUID: studyUID, uids: uids, urls: allUrls };
        }

        async function downloadCase(requestId, job) {
          var studyUID = job.studyUID;
          var uids = job.uids;
          var allUrls = job.urls || [];
          var total = allUrls.length;
          var done = 0;
          var failed = 0;
          postToParent({ type: 'PROGRESS', requestId: requestId, studyUID: studyUID, done: 0, total: total });

          await runWithConcurrency(allUrls, CONCURRENCY, async function (url) {
            var ok = await fetchFrameWithRetry(url);
            if (!ok) {
              failed++;
            }
            done++;
            postToParent({ type: 'PROGRESS', requestId: requestId, studyUID: studyUID, done: done, total: total });
          });

          if (failed === 0 && total > 0) {
            // Stamp every study in the case (primary + priors) as prefetched, and
            // remember ONE of its frame URLs as a "probe" so later STATUS checks can
            // confirm it's still cached with a fast exact cache.match — never
            // cache.keys() (which throws "Operation too large" on big caches).
            uids.forEach(function (u) {
              markPrefetched(u);
              setProbe(u, firstUrlForStudy(allUrls, u));
              setFrameCount(u, countUrlsForStudy(allUrls, u));
            });
            postToParent({ type: 'DONE', requestId: requestId, studyUID: studyUID, ok: true });
          } else {
            postToParent({
              type: 'DONE',
              requestId: requestId,
              studyUID: studyUID,
              ok: false,
              error: total === 0 ? 'no frames found' : failed + '/' + total + ' frame(s) failed',
            });
          }
        }

        // ---- command handling --------------------------------------------------
        var busy = false;
        async function handleCommand(cmd) {
          if (cmd.type === 'STATUS') {
            // Per-study exact lookup (scan-free): confirm each requested study by
            // matching its probe frame URL. Works no matter how big the cache is —
            // unlike cache.keys(), which throws "Operation too large" once the cache
            // holds tens of thousands of frames and made the dot wrongly flip OFF.
            var map = {};
            var sUids = cmd.studyUIDs || [];
            for (var si = 0; si < sUids.length; si++) {
              map[sUids[si]] = await isStudyCached(sUids[si]);
            }
            postToParent({ type: 'STATUS_RESULT', requestId: cmd.requestId, statusMap: map });
            return;
          }
          if (cmd.type === 'CLEAR') {
            var clearUids = cmd.studyUIDs;
            if (clearUids && clearUids.length) {
              // Scoped clear: only the given studies (e.g. one module's cases).
              // deleteStudyFromCache also removes each study's store-time flag.
              for (var ci = 0; ci < clearUids.length; ci++) {
                await deleteStudyFromCache(clearUids[ci]);
              }
            } else {
              // Full clear: whole cache + all flags + all probes.
              try {
                await caches.delete(CACHE_NAME);
              } catch (e) {}
              try {
                for (var i = localStorage.length - 1; i >= 0; i--) {
                  var key = localStorage.key(i);
                  if (
                    key &&
                    (key.indexOf(FLAG_PREFIX) === 0 ||
                      key.indexOf(PROBE_PREFIX) === 0 ||
                      key.indexOf(FRAMES_PREFIX) === 0)
                  ) {
                    localStorage.removeItem(key);
                  }
                }
              } catch (e) {}
            }
            postToParent({ type: 'DONE', requestId: cmd.requestId, studyUID: null, ok: true });
            return;
          }
          if (cmd.type === 'PREFETCH') {
            // Serialize prefetch runs so concurrent clicks don't thrash the network.
            while (busy) {
              await new Promise(function (r) {
                setTimeout(r, 150);
              });
            }
            busy = true;
            try {
              var controlling = await ensureController();
              if (!controlling) {
                // No controlling SW -> fetches won't cache. Report failure so the
                // LMS doesn't show a false "Prefetched".
                (cmd.studies || []).forEach(function (s) {
                  postToParent({ type: 'DONE', requestId: cmd.requestId, studyUID: s.studyUID, ok: false, error: 'service worker not controlling' });
                });
                return;
              }
              var studies = cmd.studies || [];
              // Phase 1 — enumerate EVERY case first and announce its frame total
              // (done:0, total:N). The LMS learns the whole batch size up-front, so the
              // ETA is based on real numbers from the start, not a running guess.
              var jobs = [];
              for (var s = 0; s < studies.length; s++) {
                var job = await enumerateCase(studies[s].studyUID, studies[s].priorUIDs);
                jobs.push(job);
                if (job.urls) {
                  postToParent({ type: 'PROGRESS', requestId: cmd.requestId, studyUID: job.studyUID, done: 0, total: job.urls.length });
                } else {
                  // Enumeration failed → report this case done-with-error now and skip it below.
                  postToParent({ type: 'DONE', requestId: cmd.requestId, studyUID: job.studyUID, ok: false, error: job.error });
                }
              }
              // Phase 2 — download the frames, case by case. After each case,
              // enforce the cache caps (evict the oldest WHOLE study if over the
              // study / frame / byte limit) so the cache never rides a ceiling
              // mid-batch and studies are never split.
              for (var d = 0; d < jobs.length; d++) {
                if (jobs[d].urls) {
                  await downloadCase(cmd.requestId, jobs[d]);
                  await enforceCaps();
                }
              }
            } finally {
              busy = false;
            }
          }
        }

        window.addEventListener('message', function (e) {
          if (PARENT_ORIGIN && e.origin !== PARENT_ORIGIN) {
            return; // only the LMS origin may command the bridge
          }
          var data = e.data || {};
          if (data.channel !== CHANNEL) {
            return;
          }
          if (data.type === 'STATUS' || data.type === 'PREFETCH' || data.type === 'CLEAR') {
            handleCommand(data);
          }
        });

        // Register the viewer's SW (same origin) then announce readiness.
        (async function boot() {
          var controlling = false;
          try {
            if ('serviceWorker' in navigator) {
              await navigator.serviceWorker.register('/sw.js');
              controlling = await ensureController();
            }
          } catch (e) {
            /* ignore — READY will report controlling:false */
          }
          postToParent({ type: 'READY', controlling: controlling });
        })();
      })();
    </script>
  </body>
</html>
