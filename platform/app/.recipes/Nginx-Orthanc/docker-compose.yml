# Reference:
# - https://docs.docker.com/compose/compose-file
# - https://eclipsesource.com/blogs/2018/01/11/authenticating-reverse-proxy-with-keycloak/

services:
  # Exposed server that's handling incoming web requests
  ohif_viewer:
    build:
      # Project root
      context: ./../../../../
      # Relative to context
      dockerfile: ./platform/app/.recipes/Nginx-Orthanc/dockerfile
    image: webapp:latest
    container_name: ohif_orthanc
    volumes:
      # Nginx config
      - ./config/nginx.conf:/etc/nginx/nginx.conf
      # Logs
      - ./logs/nginx:/var/logs/nginx
      # Let's Encrypt
      # - letsencrypt_certificates:/etc/letsencrypt
      # - letsencrypt_challenges:/var/www/letsencrypt
      # TLS certificates and ACME HTTP challenge files
      - ./certificates/letsencrypt:/etc/letsencrypt:ro
      - ./certificates/letsencrypt-challenges:/var/www/letsencrypt
    ports:
      - '443:443' # SSL
      - '80:80' # Web
    depends_on:
      #   - keycloak
      - orthanc
    restart: on-failure

  # LINK: https://hub.docker.com/r/jodogne/orthanc-plugins/
  # TODO: Update to use Postgres
  # https://github.com/mrts/docker-postgresql-multiple-databases
  orthanc:
      # Azure/Google object-storage plugins are only shipped in "-full" images.
    image: orthancteam/orthanc:latest-full
    hostname: orthanc
    container_name: orthancPACS
    extra_hosts:
      # Enable access to host machine from container (for webhook to backend API)
      - "host.docker.internal:host-gateway"
    environment:
      # Override sensitive values from .env (do not store secrets in orthanc.json).
      ORTHANC__REGISTERED_USERS: '{"${ORTHANC_ADMIN_USERNAME:-admin}":"${ORTHANC_ADMIN_PASSWORD:?set ORTHANC_ADMIN_PASSWORD in .env}"}'
      ORTHANC__AZURE_BLOB_STORAGE__CONNECTION_STRING: ${ORTHANC_AZURE_CONNECTION_STRING:?set ORTHANC_AZURE_CONNECTION_STRING in .env}
      ORTHANC__AZURE_BLOB_STORAGE__CONTAINER_NAME: ${ORTHANC_AZURE_CONTAINER_NAME:?set ORTHANC_AZURE_CONTAINER_NAME in .env}
      # Webhook URL passed to Lua script via os.getenv("WEBHOOK_URL")
      WEBHOOK_URL: ${WEBHOOK_URL:-http://host.docker.internal:4000/api/admin/cases/orthanc-webhook}
    volumes:
      # Config
      - ./config/orthanc.json:/etc/orthanc/orthanc.json:ro
      # Persist data
      - ./volumes/orthanc-db/:/var/lib/orthanc/db/
      - ./config/notify-study.lua:/etc/orthanc/notify-study.lua:ro
    restart: unless-stopped
    ports:
      - '4242:4242' # Orthanc REST API
      - '8042:8042' # Orthanc HTTP
