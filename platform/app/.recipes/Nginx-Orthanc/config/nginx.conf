  worker_processes auto;
  # Per-worker open-file limit. nginx counts every client connection AND every
  # upstream connection toward worker_connections, so this needs to be at least
  # 2 × worker_connections. Docker daemon defaults to ulimit -n=1,048,576 so
  # this is mostly explicit-documentation, but it pairs with the bump below.
  worker_rlimit_nofile 32768;
  error_log /var/logs/nginx/mydomain.error.log;
  pid /var/run/nginx.pid;
  include /usr/share/nginx/modules/*.conf;

  events {
    # Bumped from 1024 → 4096 for headroom under burst load (many users on
    # the worklist or simultaneous DICOM frame fetches). Per-connection state
    # is small; on an 8-worker box this gives ~32k concurrent connections
    # with ~1-2 GB peak memory. Conservative for the 16 GB UAT VM.
    worker_connections 4096;
    use epoll;
    multi_accept on;
  }

  http {
    include '/etc/nginx/mime.types';
    default_type application/octet-stream;

    keepalive_timeout 65;
    keepalive_requests 100000;
    tcp_nopush on;
    tcp_nodelay on;

    # Persistent upstream TCP pool to Orthanc.
    upstream orthanc_backend {
      server orthanc:8042;
      keepalive 64;
    }

    # Disk cache for per-instance DICOMweb responses (frames, metadata,
    # single-instance fetches). Per-instance data is immutable for the
    # lifetime of an instance — once a frame's bytes are stored, they
    # don't change (the SOPInstanceUID uniquely identifies them).
    #
    # On Azure-Blob-backed Orthanc the win is double:
    #   1. Repeat fetches skip Orthanc + Azure round-trip → ~5ms instead of ~200ms
    #   2. Azure egress bandwidth saved on every cache hit → real cost reduction
    #
    # Cache MISS = full chain (nginx → Orthanc → Azure → response → cache).
    # Cache HIT  = served from local disk.
    # X-Cache-Status response header surfaces which one happened (visible in
    # browser DevTools network tab).
    proxy_cache_path /var/cache/nginx/dicomweb
      levels=1:2
      keys_zone=dicom_cache:200m
      max_size=20g
      inactive=24h
      use_temp_path=off;

    # HTTP listener: redirect all traffic to HTTPS.
    server {
      listen [::]:80;
      listen 80;
      server_name uatcaseviewer.biedx.com;

      location / {
        return 301 https://$server_name$request_uri;
      }
    }

    # HTTPS listener
    server {
      listen [::]:443 ssl;
      listen 443 ssl;
      http2 on;
      server_name uatcaseviewer.biedx.com;

      ssl_certificate /etc/letsencrypt/live/uatcaseviewer.biedx.com/fullchain.pem;
      ssl_certificate_key /etc/letsencrypt/live/uatcaseviewer.biedx.com/privkey.pem;
      ssl_protocols TLSv1.2 TLSv1.3;
      ssl_session_timeout 1d;
      ssl_session_cache shared:SSL:10m;
      ssl_session_tickets off;

      gzip on;
      gzip_types text/css application/javascript application/json image/svg+xml;
      gzip_comp_level 9;
      etag on;

      # Cached path: immutable per-instance DICOMweb resources.
      #
      # Matches:
      #   /pacs/dicom-web/studies/{StudyUID}/series/{SeriesUID}/instances/{InstanceUID}
      #   /pacs/dicom-web/studies/{StudyUID}/series/{SeriesUID}/instances/{InstanceUID}/frames/N
      #   /pacs/dicom-web/studies/{StudyUID}/series/{SeriesUID}/instances/{InstanceUID}/metadata
      #
      # nginx evaluates regex locations BEFORE prefix locations, so this fires
      # for the patterns above and the un-cached /pacs/ block below handles
      # everything else (study lists, series lists, uploads, anonymize POSTs).
      #
      # Carries forward all the proxy semantics from /pacs/ EXCEPT
      # proxy_buffering — which has to be `on` for the cache to populate
      # (nginx can't write to disk if it's streaming straight to the client).
      # Buffer sizes are tuned for typical DICOM frame payloads.
      location ~ "^/pacs/dicom-web/studies/[^/]+/series/[^/]+/instances/[^/]+" {
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        add_header 'Access-Control-Allow-Origin' '*' always;
        # Surface cache state in response — useful for debugging
        # (curl -I or browser DevTools Network tab).
        add_header X-Cache-Status $upstream_cache_status always;

        # Regex locations don't honor the trailing-slash trick that the
        # prefix /pacs/ block uses (proxy_pass …/), so we rewrite the
        # /pacs/ prefix off explicitly.
        rewrite ^/pacs/(.*)$ /$1 break;
        proxy_pass http://orthanc_backend;

        # Caching needs buffering ON. Buffer sizes tuned for DICOM frame
        # payloads (~few hundred KB to few MB).
        proxy_buffering on;
        proxy_buffer_size 16k;
        proxy_buffers 32 64k;
        proxy_busy_buffers_size 128k;

        # Match the long timeouts from the existing /pacs/ block — Azure
        # Blob fetches on cold cache can be slow.
        proxy_read_timeout 600s;
        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
        send_timeout 600s;

        # Cache config
        proxy_cache dicom_cache;
        proxy_cache_key "$request_method$request_uri";
        proxy_cache_methods GET HEAD;
        proxy_cache_valid 200 24h;
        proxy_cache_valid 404 30s;
        proxy_cache_revalidate on;
        # Serve stale content if Orthanc/Azure briefly hiccups, so 100
        # users don't see error cascades during a transient issue.
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        # Coalesce thundering herd: if 50 users hit the same MISS at once,
        # only one upstream request fires; others wait briefly then get
        # the populated cache.
        proxy_cache_lock on;
        proxy_cache_lock_timeout 30s;
        # Ignore upstream Cache-Control hints (Orthanc may send no-cache
        # for some endpoints; we want our 24h TTL).
        proxy_ignore_headers Cache-Control Expires;
      }

      location /pacs/ {
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        expires 0;
        add_header Cache-Control private;
        add_header 'Access-Control-Allow-Origin' '*' always;

        proxy_pass http://orthanc_backend/;

        proxy_buffering off;
        proxy_request_buffering off;

        proxy_read_timeout 600s;
        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
        send_timeout 600s;
        keepalive_timeout 600s;
        client_max_body_size 2G;
      }

      location /sw.js {
        add_header Cache-Control "no-cache";
        proxy_cache_bypass $http_pragma;
        proxy_cache_revalidate on;
        expires off;
        access_log off;
      }

      location / {
        root /var/www/html;
        index index.html;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
      }
    }
  }
