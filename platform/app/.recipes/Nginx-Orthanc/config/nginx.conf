  worker_processes auto;
  error_log /var/logs/nginx/mydomain.error.log;
  pid /var/run/nginx.pid;
  include /usr/share/nginx/modules/*.conf;

  events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
  }

  http {
    include '/etc/nginx/mime.types';
    default_type application/octet-stream;

    keepalive_timeout 65;
    keepalive_requests 100000;
    tcp_nopush on;
    tcp_nodelay on;

    # Persistent upstream TCP pool to Orthanc.
    upstream orthanc_backend {
      server orthanc:8042;
      keepalive 64;
    }

    # ----------------------------------------------------------------------
    # DICOM prefetch / repeat-open cache (Phase 1).
    # Per-instance DICOMweb resources are immutable once stored in Orthanc, so
    # they're safe to cache. First open warms it; every later open of the same
    # case (any user) is a HIT served from local disk instead of Orthanc+Blob.
    #   keys_zone=200m -> ~1.6M keys   max_size=20g -> LRU past 20 GB
    #   inactive=24h   -> drop entries not requested for 24h
    # ----------------------------------------------------------------------
    proxy_cache_path /var/cache/nginx/dicomweb
      levels=1:2
      keys_zone=dicom_cache:200m
      max_size=20g
      inactive=24h
      use_temp_path=off;

    # HTTP listener: redirect all traffic to HTTPS.
    server {
      listen [::]:80;
      listen 80;
      server_name uatcaseviewer.biedx.com;

      location / {
        return 301 https://$server_name$request_uri;
      }
    }

    # HTTPS listener
    server {
      listen [::]:443 ssl;
      listen 443 ssl;
      http2 on;
      server_name uatcaseviewer.biedx.com;

      ssl_certificate /etc/letsencrypt/live/uatcaseviewer.biedx.com/fullchain.pem;
      ssl_certificate_key /etc/letsencrypt/live/uatcaseviewer.biedx.com/privkey.pem;
      ssl_protocols TLSv1.2 TLSv1.3;
      ssl_session_timeout 1d;
      ssl_session_cache shared:SSL:10m;
      ssl_session_tickets off;

      gzip on;
      gzip_types text/css application/javascript application/json image/svg+xml;
      gzip_comp_level 9;
      etag on;

      # ------------------------------------------------------------------
      # Cached path: immutable per-instance DICOMweb resources.
      #   /pacs/dicom-web/studies/{S}/series/{Se}/instances/{I}[/frames/N|/metadata]
      # Regex location -> wins over the /pacs/ prefix for these URLs. 24h TTL is
      # safe (instance UID bytes never change). proxy_buffering MUST be ON for
      # the cache to populate (the /pacs/ block below streams with buffering off
      # for uploads -- that can't cache, which is why this separate block exists).
      # Study/series LISTS are NOT matched here, so they stay fresh after uploads.
      # ------------------------------------------------------------------
      location ~ "^/pacs/dicom-web/studies/[^/]+/series/[^/]+/instances/[^/]+" {
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        add_header 'Access-Control-Allow-Origin' '*' always;

        # Regex locations can't use the trailing-slash prefix-strip trick, so
        # rewrite /pacs/* -> /* explicitly before proxying to Orthanc.
        rewrite ^/pacs/(.*)$ /$1 break;
        proxy_pass http://orthanc_backend;

        proxy_buffering on;
        proxy_buffer_size 16k;
        proxy_buffers 32 64k;
        proxy_busy_buffers_size 128k;

        proxy_cache dicom_cache;
        proxy_cache_key "$request_method$request_uri";
        proxy_cache_methods GET HEAD;
        proxy_cache_valid 200 24h;
        proxy_cache_valid 404 30s;
        proxy_cache_revalidate on;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 30s;

        add_header X-Cache-Status $upstream_cache_status always;

        proxy_read_timeout 600s;
        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
      }

      location /pacs/ {
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        expires 0;
        add_header Cache-Control private;
        add_header 'Access-Control-Allow-Origin' '*' always;

        proxy_pass http://orthanc_backend/;

        proxy_buffering off;
        proxy_request_buffering off;

        proxy_read_timeout 600s;
        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
        send_timeout 600s;
        keepalive_timeout 600s;
        client_max_body_size 2G;
      }

      location /sw.js {
        add_header Cache-Control "no-cache";
        proxy_cache_bypass $http_pragma;
        proxy_cache_revalidate on;
        expires off;
        access_log off;
      }

      location / {
        root /var/www/html;
        index index.html;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
      }
    }
  }
